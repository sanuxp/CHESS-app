<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="sky" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#6b1d0a"/>
      <stop offset="0.6" stop-color="#2a0c10"/>
      <stop offset="1" stop-color="#0c0509"/>
    </radialGradient>
    <radialGradient id="moon" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#ffc46b"/>
      <stop offset="0.6" stop-color="#f58a25"/>
      <stop offset="1" stop-color="#c9501a"/>
    </radialGradient>
    <linearGradient id="pawn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a4a52"/>
      <stop offset="0.5" stop-color="#2c2229"/>
      <stop offset="1" stop-color="#120c10"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="256" cy="256" r="244"/></clipPath>
    <path id="bat" d="M0 6 C-6 -2 -14 -8 -26 -6 C-22 -2 -20 4 -18 8 C-14 4 -10 6 -6 10 C-3 8 -2 6 0 6 C2 6 3 8 6 10 C10 6 14 4 18 8 C20 4 22 -2 26 -6 C14 -8 6 -2 0 6 Z"/>
  </defs>

  <circle cx="256" cy="256" r="244" fill="url(#sky)"/>

  <g clip-path="url(#disc)">
    <!-- harvest moon -->
    <circle cx="256" cy="200" r="168" fill="url(#moon)"/>
    <g fill="#c9501a" opacity="0.35">
      <circle cx="190" cy="150" r="22"/><circle cx="318" cy="130" r="16"/><circle cx="330" cy="236" r="26"/><circle cx="200" cy="250" r="14"/>
    </g>

    <!-- queen shadow -->
    <g transform="translate(71,20) scale(3.7)" fill="#0c0509" opacity="0.95">
      <circle cx="22" cy="22" r="5"/><circle cx="36" cy="16" r="5"/><circle cx="50" cy="13" r="5.5"/>
      <circle cx="64" cy="16" r="5"/><circle cx="78" cy="22" r="5"/>
      <polygon points="22,24 32,50 36,26 44,48 50,22 56,48 64,26 68,50 78,24 72,74 28,74"/>
      <rect x="28" y="74" width="44" height="6"/><rect x="24" y="80" width="52" height="10"/>
    </g>

    <!-- bats -->
    <g fill="#0c0509">
      <use href="#bat" transform="translate(96,96) scale(1.5) rotate(-12)"/>
      <use href="#bat" transform="translate(420,120) scale(1.25) rotate(10)"/>
      <use href="#bat" transform="translate(392,214) scale(0.9) rotate(-6)"/>
      <use href="#bat" transform="translate(130,190) scale(0.8) rotate(8)"/>
    </g>

    <!-- floor -->
    <rect x="0" y="396" width="512" height="120" fill="#0c0509"/>
    <g fill="#2a1016">
      <polygon points="0,404 120,404 90,444 -40,444"/><polygon points="240,404 360,404 360,444 210,444"/>
      <polygon points="480,404 600,404 640,444 450,444"/>
      <polygon points="120,444 250,444 220,512 60,512"/><polygon points="380,444 510,444 540,512 350,512"/>
    </g>
    <ellipse cx="256" cy="418" rx="70" ry="9" fill="#ff7a1a" opacity="0.45"/>

    <!-- pawn with an orange rim light -->
    <g transform="translate(111,149) scale(2.9)" stroke="#ff8a2a" stroke-width="2.2" stroke-linejoin="round" fill="url(#pawn)">
      <circle cx="50" cy="30" r="12"/>
      <rect x="38" y="40" width="24" height="6"/>
      <polygon points="43,46 57,46 65,76 35,76"/>
      <rect x="28" y="76" width="44" height="14"/>
    </g>
  </g>

  <circle cx="256" cy="256" r="244" fill="none" stroke="#ff8a2a" stroke-width="5"/>
</svg>
